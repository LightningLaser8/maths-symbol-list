<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maths Symbol List</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="delta.svg">
</head>

<body>
  <div class="stretch"></div>
  <div class="row">
    <div class="top-level-sep"></div>
    <main class="stretch col">
      <a href="index.html" class="unf">
        <h1>Maths <span class="ponk">Symbol</span> List</h1>
      </a>
      <div class="head">
        <hr>
        <div class="row">
          <div class="stretch"></div>
          <h2 id="symbol-name"></h2>
          <div class="stretch"></div>
        </div>
        <div class="row">
          <div class="stretch"></div>
          <div id="large-symbol"><span id="symbol"></span></div>
          <div class="stretch"></div>
        </div><br>
        <div class="row">
          <div class="stretch"></div>
          <div id="symbol-tags" class="syms-aka-group"></div>
          <div class="stretch"></div>
        </div>
      </div>
      <h2><span class="ponk">Related</span> Symbols</h2>
      <div class="stretch-h row" id="related-syms">
        
      </div>
    </main>
    <div class="top-level-sep"></div>
  </div>
  <div class="stretch"></div>
  <script src="viewer.js" type="module"></script>
  <script src="sizer.js" defer></script>
</body>

</html>
